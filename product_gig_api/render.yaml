services:
  - type: web
    name: product-gig-github-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: ACTION_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: rohan-099nyx/self_study
      - key: GITHUB_BRANCH
        value: main
      - key: GITHUB_DIR
        value: product-gigs
